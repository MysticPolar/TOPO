<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1208" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="The Owl's Postoffice — a daily literary dispatch from The Owl. Read dangerously." />

  <title>The Owl's Postoffice</title>

  <!-- Favicon: a small "O" — placeholder until a proper owl mark is designed -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231a1208'/%3E%3Ctext x='6' y='25' font-size='22' font-family='Georgia,serif' font-weight='700' fill='%23f5efe0'%3EO%3C/text%3E%3Ctext x='20' y='25' font-size='22' font-family='Georgia,serif' font-weight='700' fill='%23c0392b'%3E.%3C/text%3E%3C/svg%3E" />

  <!-- Wordmark font preload so the loading splash uses blackletter, not a flash of fallback serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Space+Grotesk:wght@500;700&display=swap" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #1a1208;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Loading screen */
    #loading {
      position: fixed;
      inset: 0;
      background: #1a1208;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 14px;
      padding: 0 24px;
      transition: opacity 0.4s ease;
    }

    #loading .kicker {
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 9px;
      letter-spacing: 6px;
      color: rgba(245,239,224,0.55);
      text-transform: uppercase;
    }

    #loading .logo {
      font-family: "UnifrakturMaguntia", "IM Fell English", serif;
      font-size: 52px;
      color: #f5efe0;
      letter-spacing: 1px;
      line-height: 1;
      text-align: center;
    }

    #loading .logo span { color: #c0392b; }

    #loading .tagline {
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 10px;
      letter-spacing: 5px;
      color: #54493a;
      text-transform: uppercase;
    }

    #loading .rule {
      width: 120px;
      height: 1px;
      background: rgba(245,239,224,0.15);
    }

    #loading .test-entry {
      margin-top: 18px;
      padding: 8px 18px;
      border: 1px solid rgba(245,239,224,0.35);
      background: transparent;
      color: #f5efe0;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    #loading .test-entry:hover {
      background: rgba(245,239,224,0.12);
      border-color: rgba(245,239,224,0.6);
    }

    #loading .status {
      min-height: 14px;
      margin-top: 8px;
      color: #54493a;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 10px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Loading splash -->
  <div id="loading">
    <div class="rule"></div>
    <div class="kicker">The</div>
    <div class="logo">Owl's <span>Post</span>office</div>
    <div class="tagline">Read Dangerously</div>
    <div class="rule"></div>
    <button id="test-entry" class="test-entry" type="button">Enter Preview</button>
    <div id="loading-status" class="status"></div>
  </div>

  <div id="root"></div>

  <!-- Main app entry (Vite) -->
  <script type="module" src="/src/main.jsx"></script>

  <script>
    let testEntryRequested = false;

    const hideLoading = () => {
      const loading = document.getElementById("loading");
      if (loading) {
        loading.style.opacity = "0";
        setTimeout(() => loading.remove(), 500);
      }
    };

    const testEntry = document.getElementById("test-entry");
    if (testEntry) {
      testEntry.addEventListener("click", () => {
        testEntryRequested = true;
        sessionStorage.setItem("duleme-force-home", "1");
        window.dispatchEvent(new CustomEvent("duleme-force-home"));
        testEntry.disabled = true;
        testEntry.style.opacity = "0.6";
        testEntry.style.cursor = "default";

        const status = document.getElementById("loading-status");
        if (status) status.textContent = "Loading…";

        // If React has already rendered, enter immediately.
        const root = document.getElementById("root");
        if (root && root.childElementCount > 0) {
          hideLoading();
        }
      });
    }

    // Hide loading screen once React mounts
    window.__dulemeReady = function() {
      hideLoading();
    };

    // Safety fallback: if test entry was clicked but app is still not ready,
    // keep splash visible and show a hint instead of a blank screen.
    setTimeout(() => {
      if (!testEntryRequested) return;
      const loading = document.getElementById("loading");
      const root = document.getElementById("root");
      if (loading && root && root.childElementCount === 0) {
        const status = document.getElementById("loading-status");
        if (status) status.textContent = "Still loading — please wait…";
      }
    }, 3000);
  </script>

</body>
</html>
